<style>
/* ===== Base: cấu trúc dùng chung, màu sắc lấy từ biến CSS của từng theme ===== */
:root{--sb-w:264px;--sb-w-c:80px;--ease:cubic-bezier(.4,0,.2,1)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);font-size:14px;line-height:1.5;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,p,ul{margin:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.no-anim *{transition:none!important}

/* ===== Shell ===== */
.app{display:flex;min-height:100vh}
.sidebar{position:sticky;top:0;align-self:flex-start;width:var(--sb-w);height:100vh;flex:none;display:flex;flex-direction:column;background:var(--sb-bg);color:var(--sb-text);border-right:1px solid var(--sb-border);transition:width .3s var(--ease);z-index:60}
.app.collapsed .sidebar{width:var(--sb-w-c)}

.sb-toggle{position:absolute;top:26px;right:-14px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--muted);border:1px solid var(--border-strong);box-shadow:var(--shadow-sm);z-index:2;transition:color .2s,transform .3s var(--ease)}
.sb-toggle:hover{color:var(--primary)}
.sb-toggle .i{width:16px;height:16px}
.app.collapsed .sb-toggle{transform:rotate(180deg)}

.sb-head{display:flex;align-items:center;gap:12px;height:80px;padding:0 22px;flex:none}
.brand-mark{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;background:var(--brand-bg);color:var(--brand-fg);box-shadow:var(--brand-shadow,none)}
.brand-name{font-weight:700;font-size:17px;letter-spacing:-.01em;color:var(--sb-title,var(--text))}

/* nhãn ẩn dần khi thu gọn */
.label{white-space:nowrap;overflow:hidden;max-width:170px;opacity:1;transition:opacity .2s var(--ease),max-width .3s var(--ease)}
.app.collapsed .label{opacity:0;max-width:0}

.nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 14px;scrollbar-width:thin}
.nav-title{height:40px;display:flex;align-items:flex-end;padding:0 16px 8px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sb-muted);white-space:nowrap;overflow:hidden;transition:height .3s var(--ease),padding .3s var(--ease)}
.nav-title span{transition:opacity .2s}
.app.collapsed .nav-title{height:20px;padding:0;margin:0 10px;border-bottom:1px solid var(--sb-border)}
.app.collapsed .nav-title span{opacity:0}
.nav a{position:relative;display:flex;align-items:center;gap:12px;height:44px;padding:0 16px;margin:2px 0;border-radius:var(--radius-sm);color:var(--sb-text);font-weight:500;transition:background .2s,color .2s}
.nav a:hover{background:var(--sb-hover);color:var(--sb-title,var(--text))}
.nav a.active{background:var(--sb-active-bg);color:var(--sb-active-text);box-shadow:var(--sb-active-shadow,none)}
.nav a.active .i{color:var(--sb-active-icon,currentColor)}
.badge{margin-left:auto;min-width:22px;height:22px;padding:0 7px;display:grid;place-items:center;border-radius:11px;font-size:11px;font-weight:600;background:var(--primary);color:var(--primary-contrast)}
.app.collapsed .badge{position:absolute;top:8px;right:14px;min-width:0;width:10px;height:10px;padding:0;font-size:0;border:2px solid var(--sb-bg)}

.sb-foot{padding:12px 14px 16px;border-top:1px solid var(--sb-border);flex:none}
.sb-user{display:flex;align-items:center;gap:12px;padding:8px;border-radius:var(--radius-sm)}
.sb-user .meta{min-width:0}
.sb-user strong{display:block;font-size:13px;font-weight:600;color:var(--sb-title,var(--text));text-overflow:ellipsis;overflow:hidden}
.sb-user small{display:block;color:var(--sb-muted);font-size:12px;text-overflow:ellipsis;overflow:hidden}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--avatar-bg);color:var(--avatar-fg)}
.avatar.sm{width:32px;height:32px;font-size:12px}
.avatar.lg{width:48px;height:48px;font-size:15px}

/* ===== Main + topbar ===== */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;height:72px;padding:0 32px;background:var(--topbar-bg);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--border)}
.titles{min-width:0}
.titles h1{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.titles small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{position:relative;width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--border);background:var(--surface);transition:color .2s,border-color .2s}
.icon-btn:hover{color:var(--text);border-color:var(--border-strong)}
.menu-btn{display:none}
.dot{position:absolute;top:9px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--danger);border:2px solid var(--dot-ring,var(--surface))}
.search{position:relative;margin-left:auto;width:min(340px,30vw)}
.search input{width:100%;height:40px;padding:0 14px 0 42px;border-radius:12px;border:1px solid var(--border);background:var(--surface);outline:0;transition:border-color .2s,box-shadow .2s}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--ring)}
.search .i{position:absolute;left:13px;top:11px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.seg{display:flex;padding:3px;gap:2px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border)}
.seg a{padding:6px 12px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted);transition:color .2s}
.seg a:hover{color:var(--text)}
.seg a.on{background:var(--seg-on,var(--surface));color:var(--text);box-shadow:var(--shadow-sm)}

.content{width:100%;max-width:1440px;margin:0 auto;padding:32px}
.page{display:none}
.page.active{display:block;animation:rise .4s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== Cards & components ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px 0}
.card-h h3{font-size:15px;font-weight:650}
.card-h p{color:var(--muted);font-size:12.5px}
.card-b{padding:20px 24px 24px}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:11px;font-weight:600;border:1px solid var(--border);background:var(--surface);transition:border-color .2s,transform .15s}
.btn:hover{border-color:var(--border-strong)}
.btn:active{transform:translateY(1px)}
.btn .i{width:16px;height:16px}
.btn.primary{background:var(--primary-grad,var(--primary));color:var(--primary-contrast);border-color:transparent;box-shadow:var(--btn-shadow,none)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:99px;border:1px solid var(--border);color:var(--muted);font-weight:500;font-size:13px;transition:all .2s}
.chip:hover{color:var(--text)}
.chip.on{background:var(--primary-soft);border-color:transparent;color:var(--primary)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-bottom:20px}
.stat{padding:22px;display:flex;flex-direction:column;gap:14px}
.stat .top{display:flex;align-items:center;justify-content:space-between}
.stat .k{color:var(--muted);font-weight:500}
.stat .ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.stat .v{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stat .foot{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px}
.delta{display:inline-flex;align-items:center;gap:4px;padding:3px 9px 3px 7px;border-radius:99px;font-size:12px;font-weight:600}
.delta .i{width:14px;height:14px}
.delta.up{background:var(--ok-soft);color:var(--ok)}
.delta.down{background:var(--bad-soft);color:var(--bad)}
.skel{position:relative;overflow:hidden;min-height:150px}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--shimmer,rgba(128,128,160,.12)),transparent);transform:translateX(-100%);animation:shim 1.4s infinite}
@keyframes shim{to{transform:translateX(100%)}}

.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px;margin-bottom:20px}
.feed{list-style:none;padding:0;display:flex;flex-direction:column;gap:20px}
.feed li{display:flex;gap:14px}
.feed .pt{width:10px;height:10px;margin-top:6px;border-radius:50%;flex:none;background:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.feed b{display:block;font-weight:500}
.feed small{color:var(--muted)}

.chart{position:relative;min-height:240px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid line{stroke:var(--border);stroke-dasharray:3 5}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .line{fill:none;stroke:var(--primary);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .cursor{stroke:var(--primary);stroke-opacity:.4;stroke-dasharray:3 3;opacity:0}
.chart .pt{fill:var(--surface);stroke:var(--primary);stroke-width:2.5;opacity:0}
.chart svg.hover .cursor,.chart svg.hover .pt{opacity:1}
.ctip{position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-125%);padding:7px 12px;border-radius:10px;background:var(--tip-bg);color:var(--tip-fg);font-size:12px;line-height:1.3;white-space:nowrap;transition:opacity .15s;box-shadow:var(--shadow-lg)}
.ctip b{display:block;font-size:13px}

.tbl-wrap{overflow-x:auto;padding-top:16px}
table{width:100%;border-collapse:collapse}
th{padding:11px 24px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;text-align:left;color:var(--muted);background:var(--surface-2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:15px 24px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--hover)}
tbody tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
td.empty{text-align:center;color:var(--muted);padding:44px 24px}
.who{display:flex;align-items:center;gap:12px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 24px 0}

.cust-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.cust{padding:20px;display:flex;align-items:center;gap:14px}
.cust small{display:block;color:var(--muted)}
.cust .amt{margin-left:auto;font-weight:600;white-space:nowrap}

.stack{display:grid;gap:20px;max-width:860px}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.theme-card{display:block;padding:10px;border-radius:var(--radius-sm);border:1px solid var(--border);transition:border-color .2s,box-shadow .2s}
.theme-card:hover{border-color:var(--border-strong)}
.theme-card.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--ring)}
.theme-card b{display:block;margin-top:10px;font-weight:600}
.theme-card small{color:var(--muted)}
.sw{display:block;height:68px;border-radius:8px;border:1px solid rgba(128,128,150,.25)}
.sw-light{background:linear-gradient(90deg,#fff 0 26%,#f5f6fb 26%)}
.sw-dark{background:linear-gradient(90deg,#0e1015 0 26%,#0b0c10 26%)}
.sw-aurora{background:linear-gradient(90deg,rgba(255,255,255,.14) 0 26%,transparent 26%),linear-gradient(135deg,#4b2fb5,#0c7c8c 55%,#a3307a)}
.sw-ocean{background:linear-gradient(90deg,#0b2545 0 26%,#eef4fb 26%)}
.sw-sunset{background:linear-gradient(90deg,#f6ebdc 0 26%,#fbf5ec 26%)}
.sw-mono{background:linear-gradient(90deg,#fff 0 26%,#f3f3ef 26%);box-shadow:inset 0 0 0 1px #111}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 0;border-bottom:1px solid var(--border)}
.set-row:first-child{padding-top:0}
.set-row:last-child{border:0;padding-bottom:0}
.set-row b{display:block;font-weight:600}
.set-row small{color:var(--muted)}
.switch{position:relative;width:44px;height:26px;flex:none;border-radius:99px;background:var(--border-strong);transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

/* ===== Tooltip, toast, scrim ===== */
.tip{position:fixed;z-index:200;transform:translateY(-50%);padding:6px 11px;border-radius:8px;background:var(--tip-bg);color:var(--tip-fg);font-size:12.5px;font-weight:500;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow-lg)}
.tip.show{opacity:1}
.toast{position:fixed;right:24px;bottom:24px;z-index:210;padding:12px 18px;border-radius:12px;background:var(--tip-bg);color:var(--tip-fg);font-weight:500;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .25s,transform .3s var(--ease)}
.toast.show{opacity:1;transform:none}
.scrim{position:fixed;inset:0;z-index:55;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s}

/* ===== Responsive ===== */
@media (max-width:1100px){.split{grid-template-columns:1fr}}
@media (max-width:900px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sb-w);transform:translateX(-104%);transition:transform .3s var(--ease);box-shadow:var(--shadow-lg)}
  .app.mobile-open .sidebar{transform:none}
  .app.mobile-open .scrim{opacity:1;pointer-events:auto}
  .sb-toggle{display:none}
  .menu-btn{display:grid}
  .topbar{padding:0 16px}
  .content{padding:20px 16px}
}
@media (max-width:1180px){.seg{display:none}}
@media (max-width:720px){.search,.seg{display:none}.topbar .icon-btn.bell{margin-left:auto}}
@media (max-width:560px){.titles small{display:none}th,td{padding-left:16px;padding-right:16px}.card-h,.toolbar{padding:18px 16px 0}.card-b{padding:18px 16px 20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
